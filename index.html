<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('devops_pro_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.removeAttribute('data-theme');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- PWA & Web Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="alternate" type="application/manifest+json" href="/site.webmanifest" />

    <!-- iOS & Android Standalone Mode Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DevOpsPro" />
    <meta name="application-name" content="DevOpsPro" />
    <meta name="theme-color" content="#0b1329" />

    <!-- Application Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>DevOps-Pro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
